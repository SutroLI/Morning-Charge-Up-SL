<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Charge Up — Sutro Li</title>
  <meta name="description" content="A 7-minute morning workout timer with 7 energizing exercises.">
  <meta property="og:title" content="Morning Charge Up — Sutro Li">
  <meta property="og:description" content="7 minutes to wake up your body and start your day">
  <link rel="icon" type="image/png" href="./assets/SL-Arrow-only.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #1FB8E9;
      --brand-dark: #0E5E79;
      --brand-amber: #FFB208;
      --text-on-brand: #FFFFFF;
      --text-on-brand-soft: #E5F6FD;
      --brand-50: #D2F1FB;
      --brand-100: #AEE5F7;
      --brand-200: #8BDAF4;
      --brand-400: #67CFF0;
      --brand-500: #43C3ED;
      --brand-wash: #F5FCFE;
      --brand-wash-alt: #F0F9FC;
      --brand-border-light: #B8D4E0;
      --gray-90: #1A1A1A;
      --gray-80: #333333;
      --gray-70: #4D4D4D;
      --gray-50: #6B7280;
      --gray-40: #757575;
      --gray-30: #9CA3AF;
      --gray-20: #E2E5EB;
      --gray-15: #E5E5E5;
      --gray-10: #F0F1F3;
      --gray-05: #F6F7F9;
      --gray-00: #FFFFFF;
      --gray-empty: #F2F2F2;
      --shadow-subtle: 0 2px 8px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-card: 0 14px 30px rgba(15,23,42,0.06);
      --shadow-button-brand: 0 2px 6px rgba(31,184,233,0.35);
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-xl: 16px;
      --font-family: "Lato", system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background:
        linear-gradient(180deg, var(--gray-00) 0%, var(--brand-wash) 55%, var(--brand-50) 100%);
      color: var(--gray-90);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.5;
    }

    h1, h2, h3 {
      font-family: var(--font-family);
      font-weight: 700;
      color: var(--brand-dark);
      letter-spacing: 0.02em;
    }

    .brand-gradient-text {
      color: var(--brand-dark);
    }

    .card {
      background: var(--gray-00);
      border: 1px solid var(--gray-20);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
    }

    .card-elevated {
      background: var(--gray-00);
      border: 1px solid var(--gray-15);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 700;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s, color 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--font-family);
    }

    .btn-primary {
      background: var(--brand);
      color: var(--text-on-brand);
      box-shadow: var(--shadow-button-brand);
    }
    .btn-primary:hover { background: var(--brand-dark); box-shadow: none; }

    .btn-secondary {
      background: var(--gray-00);
      color: var(--gray-80);
      border: 2px solid var(--brand);
    }
    .btn-secondary:hover { background: var(--brand-wash); }

    .btn-md { font-size: 0.95rem; padding: 12px 22px; }
    .btn-lg { font-size: 1rem; padding: 14px 28px; }
    .btn-xl { font-size: 1.125rem; padding: 18px 36px; }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .hidden { display: none !important; }

    .topbar {
      width: 100%;
      height: 56px;
      background: var(--brand);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      flex-shrink: 0;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo {
      height: 28px;
      width: auto;
      display: block;
    }

    .topbar-title {
      color: var(--text-on-brand);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .home-mark {
      width: 56px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
    }

    .progress-bar-container {
      width: 100%;
      max-width: 400px;
      height: 8px;
      background: var(--gray-empty);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 32px;
      border: 1px solid var(--gray-20);
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--brand-500), var(--brand), var(--brand-dark));
      transition: width 0.5s ease;
    }

    .timer-container {
      position: relative;
      width: 256px;
      height: 256px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-glow {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      opacity: 0.35;
      background: radial-gradient(circle, var(--brand-100) 0%, transparent 70%);
      transition: background 0.4s ease;
    }

    .timer-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-text {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .timer-number {
      font-family: var(--font-family);
      font-size: 88px;
      font-weight: 700;
      color: var(--brand-dark);
      line-height: 1;
    }

    .timer-label {
      font-size: 12px;
      color: var(--gray-50);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .workout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: center;
      width: 100%;
      max-width: 960px;
    }

    .exercise-image-box {
      padding: 20px;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      margin: 0 auto;
      background: var(--gray-00);
      border: 1px solid var(--gray-20);
      box-shadow: var(--shadow-card);
    }

    .exercise-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .workout-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 32px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wake-lock-indicator {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-on-brand-soft);
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
    }

    .wake-lock-indicator.on {
      color: var(--gray-90);
      background: var(--brand-amber);
      border-color: var(--brand-amber);
    }

    .home-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--text-on-brand);
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      transition: background 0.2s;
    }
    .home-btn:hover { background: rgba(255,255,255,0.28); }

    .home-icon {
      width: 22px;
      height: 22px;
    }

    .preview-grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 560px;
    }

    .preview-item {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-70);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
      background: var(--gray-00);
      border: 1px solid var(--gray-20);
      border-radius: var(--radius-sm);
    }

    .countdown-number {
      font-family: var(--font-family);
      font-size: 140px;
      font-weight: 700;
      color: var(--brand);
      line-height: 1;
    }

    .exercise-name {
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: var(--brand-dark);
      letter-spacing: 0.03em;
    }

    .up-next {
      padding: 10px 14px;
      color: var(--gray-50);
      font-weight: 400;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      background: var(--gray-10);
      border: 1px solid var(--gray-20);
      border-radius: var(--radius-sm);
    }

    .up-next span { color: var(--brand-dark); font-weight: 700; }

    .complete-title {
      font-size: clamp(2rem, 6vw, 3.25rem);
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.15;
      letter-spacing: 0.04em;
    }

    .complete-sub {
      font-size: 1rem;
      font-weight: 400;
      color: var(--gray-50);
      margin-bottom: 36px;
      letter-spacing: 0.02em;
    }

    .complete-bulb {
      width: 72px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
    }

    .complete-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .paused-text {
      margin-top: 20px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--brand-amber);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .home-title {
      font-size: clamp(2.25rem, 8vw, 4rem);
      line-height: 1.05;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--brand-dark);
    }

    .home-sub {
      font-size: clamp(0.95rem, 2.5vw, 1.125rem);
      color: var(--gray-50);
      margin-bottom: 36px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 400;
    }

    .countdown-label {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--gray-50);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    .countdown-label span {
      color: var(--brand-dark);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fade-in { animation: fadeIn 0.45s ease forwards; }
    .animate-scale-in { animation: scaleIn 0.35s ease forwards; }

    @media (min-width: 768px) {
      .preview-grid { grid-template-columns: repeat(4, 1fr); }
      .timer-container { width: 300px; height: 300px; }
      .timer-number { font-size: 104px; }
      .countdown-number { font-size: 160px; }
    }

    @media (min-width: 1024px) {
      .workout-grid { grid-template-columns: 1fr 1fr; }
    }

    svg.icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen">
    <div class="animate-scale-in" style="text-align:center;z-index:1;max-width:720px;width:100%;">
      <img class="home-mark" src="./assets/SL-Arrow-only.png" alt="Sutro Li">
      <h1 class="home-title">
        Morning<br>Charge Up
      </h1>
      <p class="home-sub">
        7 minutes to wake up your body and start your day.
      </p>
      <button class="btn btn-primary btn-xl" onclick="startCountdown()">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"></polygon></svg>
        Start workout
      </button>
      <div class="preview-grid">
        <div class="preview-item">Bunny hops</div>
        <div class="preview-item">Body wave</div>
        <div class="preview-item">Arm swing</div>
        <div class="preview-item">Trunk twist</div>
      </div>
    </div>
  </div>

  <!-- COUNTDOWN SCREEN -->
  <div id="screen-countdown" class="screen hidden">
    <div class="animate-scale-in" style="text-align:center;">
      <h2 class="countdown-label">
        Get ready for <span id="countdown-exercise-name"></span>…
      </h2>
      <div id="countdown-number" class="countdown-number"></div>
    </div>
  </div>

  <!-- WORKOUT SCREEN -->
  <div id="screen-workout" class="screen hidden" style="justify-content:flex-start;padding:0;">
    <div class="topbar">
      <div class="topbar-brand">
        <img class="topbar-logo" src="./assets/SL_logo_white.png" alt="Sutro Li">
        <div class="topbar-title">Morning Charge Up</div>
      </div>
      <div class="header-actions">
        <div id="wake-lock-status" class="wake-lock-indicator">Screen lock: off</div>
        <button class="home-btn" onclick="showScreen('home')" aria-label="Home">
          <svg class="icon home-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
      </div>
    </div>

    <div class="workout-body">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar-fill" style="width:0%"></div>
      </div>

      <div class="workout-grid">
        <div style="display:flex;flex-direction:column;align-items:center;order:2;">
          <div class="timer-container" style="margin-bottom:28px;">
            <div id="timer-glow" class="timer-glow"></div>
            <svg class="timer-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" fill="transparent" stroke="var(--gray-20)" stroke-width="4"/>
              <defs>
                <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#43C3ED"/>
                  <stop offset="50%" stop-color="#1FB8E9"/>
                  <stop offset="100%" stop-color="#0E5E79"/>
                </linearGradient>
              </defs>
              <circle id="timer-circle" cx="50" cy="50" r="45" fill="transparent"
                stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="282.74" stroke-dashoffset="0"
                style="transition:stroke-dashoffset 0.5s ease;"/>
            </svg>
            <div class="timer-text">
              <div id="timer-number" class="timer-number">60</div>
              <div class="timer-label">Seconds left</div>
            </div>
          </div>
          <div style="display:flex;gap:12px;">
            <button id="btn-pause" class="btn btn-secondary btn-lg" onclick="togglePause()" style="min-width:140px;">
              <svg id="icon-pause" class="icon" width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect></svg>
              <svg id="icon-play" class="icon hidden" width="18" height="18" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"></polygon></svg>
              <span id="pause-text">Pause</span>
            </button>
          </div>
          <div id="paused-label" class="paused-text hidden">Paused</div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;order:1;">
          <h2 id="current-exercise-name" class="exercise-name"></h2>
          <div class="exercise-image-box">
            <img id="current-exercise-img" src="" alt="">
          </div>
          <div id="up-next" class="up-next" style="margin-top:20px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- COMPLETE SCREEN -->
  <div id="screen-complete" class="screen hidden">
    <div class="animate-fade-in" style="text-align:center;">
      <img class="complete-bulb" src="./assets/BULB_ONLY.png" alt="">
      <h1 class="complete-title">Workout complete</h1>
      <p class="complete-sub">Nice work — you’re charged up.</p>
      <div class="complete-buttons">
        <button class="btn btn-secondary btn-md" onclick="showScreen('home')">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Home
        </button>
        <button class="btn btn-primary btn-md" onclick="restartWorkout()">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          Again
        </button>
      </div>
    </div>
  </div>

  <script>
    var exercises = [
      { name: "BUNNY HOPS", duration: 60, image: "bunny-hops.png" },
      { name: "BODY WAVE", duration: 60, image: "body-wave.png" },
      { name: "ARM SWING", duration: 60, image: "arm-swing.png" },
      { name: "TRUNK TWIST", duration: 60, image: "trunk-twist.png" },
      { name: "DEAD ARM", duration: 60, image: "dead-arm.png" },
      { name: "GOLF TWIST", duration: 60, image: "golf-twist.png" },
      { name: "STANDING MARCH", duration: 60, image: "standing-march.png" }
    ];

    var SOUNDS = {
      tick: "https://assets.mixkit.co/active_storage/sfx/2579/2579-preview.mp3",
      complete: "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"
    };

    var transitionGongHowl = null;
    var TRANSITION_CHIME_RATE = 2.5;
    var TRANSITION_CHIME_VOLUME = 0.6;
    var TRANSITION_CHIME_START_MS = 180;
    var TRANSITION_CHIME_DURATION_MS = 3420;

    function playTransitionGong(volume) {
      var v = typeof volume === 'number' ? volume : TRANSITION_CHIME_VOLUME;
      if (!transitionGongHowl) {
        transitionGongHowl = new Howl({
          src: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/f/fa/Gong_or_bell_vibrant.ogg/Gong_or_bell_vibrant.ogg.mp3'],
          sprite: { strike: [TRANSITION_CHIME_START_MS, TRANSITION_CHIME_DURATION_MS] }
        });
      }
      transitionGongHowl.volume(v);
      transitionGongHowl.rate(TRANSITION_CHIME_RATE);
      transitionGongHowl.play('strike');
    }

    var currentExerciseIndex = 0;
    var timeLeft = 0;
    var timerInterval = null;
    var isPaused = false;
    var autoPausedByVisibility = false;
    var circumference = 2 * Math.PI * 45;
    var wakeLockSentinel = null;
    var wakeLockBound = false;

    function updateWakeLockStatus() {
      var indicator = document.getElementById('wake-lock-status');
      if (!indicator) return;

      if (!('wakeLock' in navigator)) {
        indicator.textContent = 'Screen lock: unsupported';
        indicator.classList.remove('on');
        return;
      }

      var isOn = !!(wakeLockSentinel && !wakeLockSentinel.released);
      indicator.textContent = 'Screen lock: ' + (isOn ? 'on' : 'off');
      indicator.classList.toggle('on', isOn);
    }

    function shouldKeepWakeLock() {
      var isWorkoutVisible = !document.getElementById('screen-workout').classList.contains('hidden');
      return isWorkoutVisible && !isPaused && timeLeft > 0;
    }

    function syncWakeLock() {
      if (shouldKeepWakeLock()) {
        requestWakeLock();
      } else {
        releaseWakeLock();
      }
    }

    function playSound(name, volume) {
      try {
        if (document.visibilityState !== 'visible') return;
        var v = typeof volume === 'number' ? volume : 0.5;
        if (name === 'chime') {
          playTransitionGong(v);
          return;
        }
        var s = new Howl({ src: [SOUNDS[name]], volume: v });
        s.play();
      } catch(e) {}
    }

    function showScreen(name) {
      var screens = ['home','countdown','workout','complete'];
      screens.forEach(function(s) {
        document.getElementById('screen-' + s).classList.add('hidden');
      });
      document.getElementById('screen-' + name).classList.remove('hidden');

      if (name === 'home') {
        releaseWakeLock();
        resetState();
      }

      updateWakeLockStatus();
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      if (wakeLockSentinel && !wakeLockSentinel.released) return;

      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', function() {
          wakeLockSentinel = null;
          updateWakeLockStatus();
        });
        updateWakeLockStatus();
      } catch (e) {}
    }

    async function releaseWakeLock() {
      if (!wakeLockSentinel) return;
      try {
        await wakeLockSentinel.release();
      } catch (e) {}
      wakeLockSentinel = null;
      updateWakeLockStatus();
    }

    function ensureWakeLockListeners() {
      if (wakeLockBound) return;
      wakeLockBound = true;

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (
            autoPausedByVisibility &&
            !document.getElementById('screen-workout').classList.contains('hidden')
          ) {
            isPaused = false;
            autoPausedByVisibility = false;
            updatePauseButton();
            document.getElementById('paused-label').classList.add('hidden');
          }
          syncWakeLock();
        } else {
          if (
            !document.getElementById('screen-workout').classList.contains('hidden') &&
            !isPaused
          ) {
            isPaused = true;
            autoPausedByVisibility = true;
            updatePauseButton();
            document.getElementById('paused-label').classList.remove('hidden');
          }
          if (transitionGongHowl) transitionGongHowl.stop();
          releaseWakeLock();
        }
      });
    }

    function startCountdown() {
      ensureWakeLockListeners();
      showScreen('countdown');
      document.getElementById('countdown-exercise-name').textContent = exercises[0].name;
      timeLeft = 5;
      document.getElementById('countdown-number').textContent = timeLeft;
      playSound('tick');

      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        timeLeft--;
        document.getElementById('countdown-number').textContent = timeLeft;
        if (timeLeft <= 4 && timeLeft > 1) playSound('tick');
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          startExercise(0);
        }
      }, 1000);
    }

    function startExercise(index) {
      currentExerciseIndex = index;
      var ex = exercises[index];
      timeLeft = ex.duration;
      isPaused = false;

      showScreen('workout');
      syncWakeLock();
      updatePauseButton();
      document.getElementById('paused-label').classList.add('hidden');

      document.getElementById('current-exercise-name').textContent = ex.name;
      document.getElementById('current-exercise-img').src = ex.image;
      document.getElementById('current-exercise-img').alt = ex.name;
      updateTimer();
      updateProgressBar();

      var next = exercises[index + 1];
      var upNext = document.getElementById('up-next');
      if (next) {
        upNext.innerHTML = 'Up next: <span>' + next.name + '</span>';
        upNext.classList.remove('hidden');
      } else {
        upNext.classList.add('hidden');
      }

      playSound('chime', TRANSITION_CHIME_VOLUME);

      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        if (!isPaused) {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 4 && timeLeft > 1) playSound('tick');
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (currentExerciseIndex < exercises.length - 1) {
              startExercise(currentExerciseIndex + 1);
            } else {
              completeWorkout();
            }
          }
        }
      }, 1000);
    }

    function updateTimer() {
      document.getElementById('timer-number').textContent = timeLeft;
      var ex = exercises[currentExerciseIndex];
      var offset = circumference - (timeLeft / ex.duration) * circumference;
      document.getElementById('timer-circle').setAttribute('stroke-dashoffset', offset);

      var pct = timeLeft / ex.duration;
      var color = pct > 0.5 ? '#1FB8E9' : pct > 0.25 ? '#0E5E79' : '#FFB208';
      document.getElementById('timer-glow').style.background =
        'radial-gradient(circle, ' + color + '33 0%, transparent 70%)';
    }

    function updateProgressBar() {
      var pct = ((currentExerciseIndex + 1) / exercises.length) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    function togglePause() {
      isPaused = !isPaused;
      autoPausedByVisibility = false;
      updatePauseButton();
      document.getElementById('paused-label').classList.toggle('hidden', !isPaused);
      syncWakeLock();
    }

    function updatePauseButton() {
      document.getElementById('icon-pause').classList.toggle('hidden', isPaused);
      document.getElementById('icon-play').classList.toggle('hidden', !isPaused);
      document.getElementById('pause-text').textContent = isPaused ? 'Resume' : 'Pause';
    }

    function completeWorkout() {
      clearInterval(timerInterval);
      releaseWakeLock();
      showScreen('complete');
      playSound('complete');
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#1FB8E9', '#0E5E79', '#FFB208', '#43C3ED', '#AEE5F7']
      });
    }

    function restartWorkout() {
      resetState();
      startCountdown();
    }

    function resetState() {
      clearInterval(timerInterval);
      releaseWakeLock();
      currentExerciseIndex = 0;
      timeLeft = 0;
      isPaused = false;
      autoPausedByVisibility = false;
      updateWakeLockStatus();
    }

    ensureWakeLockListeners();
    updateWakeLockStatus();
  </script>
</body>
</html>
